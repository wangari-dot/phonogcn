    const grid = document.getElementById('grid');
    const searchEl = document.getElementById('search');
    const countLabel = document.getElementById('count-label');
    const letterJump = document.getElementById('letter-jump');

    // Build alphabet jump buttons
    const letters = [...new Set(vocab.map(v => v.gloss[0]))].sort();
    letters.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'letter-btn';
      btn.textContent = l;
      btn.onclick = () => {
        searchEl.value = '';
        renderCards(vocab.filter(v => v.gloss.startsWith(l)));
        document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
      letterJump.appendChild(btn);
    });

    // Add "All" button
    const allBtn = document.createElement('button');
    allBtn.className = 'letter-btn active';
    allBtn.textContent = 'All';
    allBtn.onclick = () => {
      searchEl.value = '';
      renderCards(vocab);
      document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
      allBtn.classList.add('active');
    };
    letterJump.prepend(allBtn);

    function renderCards(items, query='') {
      grid.innerHTML = '';
      if (items.length === 0) {
        grid.innerHTML = '<div class="no-results">No glosses found.</div>';
      } else {
        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card' + (query && item.gloss.includes(query.toUpperCase()) ? ' highlight' : '');
          card.innerHTML = `<div class="gloss">${item.gloss}</div><div class="id">ID: ${item.id}</div>`;
          grid.appendChild(card);
        });
      }
      countLabel.textContent = `Showing ${items.length} of ${vocab.length}`;
    }

    searchEl.addEventListener('input', () => {
      const q = searchEl.value.trim().toUpperCase();
      document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
      if (!q) {
        allBtn.classList.add('active');
        renderCards(vocab);
      } else {
        renderCards(vocab.filter(v => v.gloss.includes(q)), q);
      }
    });

    renderCards(vocab);
  </script>
